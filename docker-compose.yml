services:
  # ── Postgres ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"           # host access for psql / Prisma Studio from host. Remove in prod.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [ internal ]

  # ── Mailpit (dev-only SMTP catcher) ───────────────────────
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"           # Web UI
      - "1025:1025"           # SMTP
    networks: [ internal ]

  # ── Backend API ───────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./backend:/app
      - /app/node_modules               # keep container's node_modules isolated
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"                     # direct API access (also proxied via nginx :80)
      - "5555:5555"                     # Prisma Studio
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks: [ internal ]

  # ── Frontend (Vite dev server in this compose file) ───────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks: [ internal ]

  # ── Edge proxy (nginx) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    depends_on:
      - api
      - web
    networks: [ internal ]

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
    driver: bridge